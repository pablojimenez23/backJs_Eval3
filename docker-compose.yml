version: '3.8'
services:
  user-service:
    build: .
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=Password123!
      - DB_NAME=users_db
      - PORT=8081
    depends_on:
      - mysql
    networks:
      - innovatech-net

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=Password123!
      - MYSQL_DATABASE=users_db
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - innovatech-net

volumes:
  mysql-data:

networks:
  innovatech-net:
    driver: bridge